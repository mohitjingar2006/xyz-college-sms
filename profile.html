<!-- MEMBER A: Profile Component HTML Template -->
<!-- Note: Member B/C should inject this HTML fragment into their dashboards and call initializeProfileComponent(user) -->
<div class="academic-card" id="profileComponentRoot">
  <div class="academic-card-header flex justify-between items-center">
    <h2 class="academic-card-title">User Account Profile</h2>
    <button onclick="document.getElementById('profileEditFormPanel').classList.toggle('hidden')" class="btn-primary text-sm">Edit Profile</button>
  </div>

  <div class="flex flex-col sm:flex-row items-center sm:items-start gap-6 pb-6 border-b">
    <div class="text-center">
      <img src="" alt="User Avatar" id="displayUserPhoto" class="preview-avatar mb-2">
      <span id="displayUserRole" class="text-xs bg-slate-200 px-2 py-0.5 rounded text-slate-700 font-semibold capitalize"></span>
    </div>
    <div class="flex-1 text-center sm:text-left">
      <h3 class="text-xl font-bold text-slate-800" id="displayUserName"></h3>
      <p class="text-sm text-slate-500" id="displayUserEmail"></p>
      <p class="text-sm text-slate-500">Phone: <span id="displayUserPhone"></span></p>
      <div class="mt-3">
        <span class="text-xs text-slate-400 block font-semibold">DIGITAL SIGNATURE</span>
        <img src="" alt="Digital Signature" id="displayUserSignature" class="preview-signature mt-1">
      </div>
    </div>
  </div>

  <!-- Dynamic Role Attributes injected here -->
  <div id="roleSpecificDetails" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4 bg-slate-50 p-4 rounded border"></div>

  <!-- Edit Panel -->
  <div id="profileEditFormPanel" class="hidden mt-6 pt-6 border-t border-dashed border-slate-300">
    <h3 class="font-serif font-bold text-lg mb-4" style="color: var(--primary-navy);">Update Profile</h3>
    <form id="userProfileForm">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" id="editName" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="text" id="editPhone" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Upload New Photo</label>
          <input type="file" id="editPhotoFile" class="form-input" accept="image/*">
        </div>
        <div class="form-group">
          <label class="form-label">Upload New Signature</label>
          <input type="file" id="editSignatureFile" class="form-input" accept="image/*">
        </div>
        <!-- Dynamic Edit Fields (Address/Research) injected here -->
        <div id="dynamicEditFields" class="form-group md:col-span-2"></div>
      </div>
      <div id="profileUpdateError" class="hidden bg-red-100 text-red-700 p-2 mt-2 rounded text-sm"></div>
      <div id="profileUpdateSuccess" class="hidden bg-green-100 text-green-700 p-2 mt-2 rounded text-sm"></div>
      <div class="flex justify-end gap-2 mt-4">
        <button type="button" onclick="document.getElementById('profileEditFormPanel').classList.add('hidden')" class="btn-outline">Cancel</button>
        <button type="submit" class="btn-primary" id="saveProfileBtn">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<script>
  let currentProfileUser = null;

  function initializeProfileComponent(user) {
    currentProfileUser = user;
    const role = user.role || document.body.dataset.role; // Fallback if role is external
    
    document.getElementById('displayUserName').innerText = user.name || 'N/A';
    document.getElementById('displayUserEmail').innerText = user.email || 'N/A';
    document.getElementById('displayUserPhone').innerText = user.phone_number || 'N/A';
    document.getElementById('displayUserRole').innerText = role;
    document.getElementById('displayUserPhoto').src = user.photo_url || 'https://via.placeholder.com/96?text=User';
    document.getElementById('displayUserSignature').src = user.signature_url || 'https://via.placeholder.com/180x50?text=Signature';

    document.getElementById('editName').value = user.name || '';
    document.getElementById('editPhone').value = user.phone_number || '';

    const detailsDiv = document.getElementById('roleSpecificDetails');
    const dynamicEdits = document.getElementById('dynamicEditFields');
    
    if (role === 'student') {
      detailsDiv.innerHTML = `
        <div><span class="text-xs text-slate-500 font-semibold block">PROGRAM & DEPT</span><span class="font-medium">${user.program} - ${user.department}</span></div>
        <div><span class="text-xs text-slate-500 font-semibold block">BRANCH</span><span class="font-medium">${user.branch}</span></div>
        <div><span class="text-xs text-slate-500 font-semibold block">SEMESTER</span><span class="font-medium">${user.current_semester}</span></div>
        <div><span class="text-xs text-slate-500 font-semibold block">HOSTEL & MESS</span><span class="font-medium">${user.hostel_details} | ${user.mess_choice}</span></div>
        <div class="md:col-span-2"><span class="text-xs text-slate-500 font-semibold block">ADDRESS</span><span class="font-medium">${user.home_address}</span></div>
      `;
      dynamicEdits.innerHTML = `
        <label class="form-label">Home Address</label>
        <textarea id="editAddress" class="form-textarea" rows="2">${user.home_address || ''}</textarea>
      `;
    } else if (role === 'faculty') {
      detailsDiv.innerHTML = `
        <div><span class="text-xs text-slate-500 font-semibold block">DEPARTMENT</span><span class="font-medium">${user.department}</span></div>
        <div><span class="text-xs text-slate-500 font-semibold block">DESIGNATION</span><span class="font-medium">${user.designation}</span></div>
        <div><span class="text-xs text-slate-500 font-semibold block">POSITIONS</span><span class="font-medium">${user.additional_positions}</span></div>
        <div class="md:col-span-2"><span class="text-xs text-slate-500 font-semibold block">RESEARCH</span><span class="font-medium">${user.research_topics}</span></div>
      `;
      dynamicEdits.innerHTML = `
        <label class="form-label">Research Topics</label>
        <textarea id="editResearch" class="form-textarea" rows="2">${user.research_topics || ''}</textarea>
      `;
    } else if (role === 'admin') {
      detailsDiv.innerHTML = `<div><span class="text-xs text-slate-500 font-semibold block">ROLE TITLE</span><span class="font-medium">${user.role_title}</span></div>`;
      dynamicEdits.innerHTML = '';
    }
  }

  document.getElementById('userProfileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveProfileBtn');
    const errDiv = document.getElementById('profileUpdateError');
    const succDiv = document.getElementById('profileUpdateSuccess');
    
    errDiv.classList.add('hidden');
    succDiv.classList.add('hidden');
    btn.disabled = true;
    btn.innerText = 'Saving...';

    try {
      const role = currentProfileUser.role || document.body.dataset.role;
      let fieldsToUpdate = {
        name: document.getElementById('editName').value,
        phone_number: document.getElementById('editPhone').value
      };

      if (role === 'student' && document.getElementById('editAddress')) {
        fieldsToUpdate.home_address = document.getElementById('editAddress').value;
      }
      if (role === 'faculty' && document.getElementById('editResearch')) {
        fieldsToUpdate.research_topics = document.getElementById('editResearch').value;
      }

      // Handle Image Uploads via Member C's uploadImage contract
      const photoFile = document.getElementById('editPhotoFile').files[0];
      const sigFile = document.getElementById('editSignatureFile').files[0];
      
      if (photoFile) {
        fieldsToUpdate.photo_url = await uploadImage(photoFile, 'photo', currentProfileUser.id);
      }
      if (sigFile) {
        fieldsToUpdate.signature_url = await uploadImage(sigFile, 'signature', currentProfileUser.id);
      }

      // Update Database
      await updateOwnProfile(role, fieldsToUpdate);
      
      // Update local state and re-render
      Object.assign(currentProfileUser, fieldsToUpdate);
      initializeProfileComponent(currentProfileUser);
      
      succDiv.innerText = "Profile updated successfully!";
      succDiv.classList.remove('hidden');
      document.getElementById('userProfileForm').reset();
    } catch (error) {
      errDiv.innerText = error.message || "Failed to update profile.";
      errDiv.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.innerText = 'Save Changes';
    }
  });
</script>
